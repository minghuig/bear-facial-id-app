# Shared service definitions. Use `make local` or the explicit `make mock-smoke` test.
services:
  db:
    image: postgres:16.10
    environment:
      POSTGRES_DB: bears
      POSTGRES_USER: bears
      POSTGRES_PASSWORD: ${DB_PASSWORD:-local-development-only}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, pg_isready -U bears]
      interval: 3s
      retries: 30
  minio:
    image: quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-local-bears}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-local-bears-storage-password}
    volumes: [objects:/data]
  init-storage:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    entrypoint: /bin/sh
    command: ['-c', 'until mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-local-bears} ${MINIO_ROOT_PASSWORD:-local-bears-storage-password}; do sleep 2; done; mc mb --ignore-existing local/only-bears']
  migrate:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-local-bears}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-bears-storage-password}
    command: alembic upgrade head
    depends_on:
      db: {condition: service_healthy}
  api:
    build: {context: ., dockerfile: backend/Dockerfile}
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-local-bears}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:-local-bears-storage-password}
    ports: ['127.0.0.1:8000:8000']
    depends_on:
      migrate: {condition: service_completed_successfully}
      init-storage: {condition: service_completed_successfully}
    restart: unless-stopped
volumes:
  pgdata:
  objects:
